  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn btn-ghost btn-icon menu-toggle" id="menu-toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div>
          <div class="topbar-title">Activity Logs</div>
          <div class="topbar-breadcrumb">Admin / <span>Logs</span></div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="badge badge-red">Admin Mode</span>
        <select id="limit-select" class="form-input" style="width:auto;font-size:0.8125rem">
          <option value="50">Last 50</option>
          <option value="100" selected>Last 100</option>
          <option value="250">Last 250</option>
          <option value="500">Last 500</option>
        </select>
        <button class="topbar-icon-btn" id="theme-toggle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg></button>
      </div>
    </header>

    <main class="page-content">

      <!-- Action summary -->
      <div class="admin-stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:24px" id="action-counts">
        <!-- filled by JS -->
      </div>

      <!-- Toolbar -->
      <div class="table-toolbar">
        <div class="table-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search-input" placeholder="Search action, user, detail…" />
        </div>
        <select id="action-filter" class="form-input" style="width:auto;font-size:0.8125rem">
          <option value="">All actions</option>
          <option value="LOGIN">LOGIN</option>
          <option value="LOGOUT">LOGOUT</option>
          <option value="REGISTER">REGISTER</option>
          <option value="UPLOAD">UPLOAD</option>
          <option value="DELETE">DELETE</option>
          <option value="CHANGE_PASSWORD">CHANGE_PASSWORD</option>
        </select>
      </div>

      <!-- Table -->
      <div class="data-table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>Action</th><th>User ID</th><th>Detail</th><th>IP Address</th><th>Time</th>
          </tr></thead>
          <tbody id="logs-tbody">
            <tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:28px">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </main>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/ui.js"></script>
<script>
  requireAdmin();

  let allLogs = [];
  let currentPage = 1;
  const PAGE_SIZE = 20;

  async function loadLogs() {
    const limit = document.getElementById('limit-select').value;
    try {
      allLogs = await AdminAPI.logs(limit);
      renderActionCounts(allLogs);
      applyFilters();
    } catch(e) { Toast.error(e.message); }
  }

  function renderActionCounts(logs) {
    const counts = {};
    logs.forEach(l => { counts[l.action] = (counts[l.action]||0)+1; });
    const colors = { LOGIN:'rgba(34,197,94,0.15)', LOGOUT:'rgba(100,116,139,0.15)', REGISTER:'rgba(59,130,246,0.15)', UPLOAD:'rgba(139,92,246,0.15)', DELETE:'rgba(239,68,68,0.15)', CHANGE_PASSWORD:'rgba(245,158,11,0.15)' };
    const icons  = { LOGIN:'🔐', LOGOUT:'🚪', REGISTER:'✍️', UPLOAD:'📤', DELETE:'🗑', CHANGE_PASSWORD:'🔑' };
    document.getElementById('action-counts').innerHTML = Object.entries(counts).map(([a,c])=>`
      <div class="stat-card" style="--stat-color:${colors[a]||'rgba(100,116,139,0.1)'}">
        <div class="stat-icon">${icons[a]||'•'}</div>
        <div class="stat-label">${a}</div>
        <div class="stat-value">${c}</div>
      </div>
    `).join('');
  }

  function applyFilters() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const action = document.getElementById('action-filter').value;
    const filtered = allLogs.filter(l => {
      const matchQ = l.action.toLowerCase().includes(q) ||
                     (l.detail||'').toLowerCase().includes(q) ||
                     (l.user_id||'').toLowerCase().includes(q) ||
                     (l.ip_address||'').toLowerCase().includes(q);
      const matchA = !action || l.action === action;
      return matchQ && matchA;
    });
    currentPage = 1;
    renderTable(filtered);
  }

  function renderTable(logs) {
    const tbody = document.getElementById('logs-tbody');
    const total = logs.length;
    const pages = Math.ceil(total/PAGE_SIZE);
    const slice = logs.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

    if (!slice.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:28px">No logs found</td></tr>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = slice.map(l => `
      <tr>
        <td><span class="log-action ${l.action}">${l.action}</span></td>
        <td class="text-sm text-muted" style="font-family:monospace">${l.user_id ? l.user_id.slice(0,12)+'…' : '—'}</td>
        <td class="text-sm text-muted">${l.detail || '—'}</td>
        <td class="text-sm text-muted">${l.ip_address || '—'}</td>
        <td class="text-sm text-muted">${formatDateTime(l.created_at)}</td>
      </tr>
    `).join('');

    // Pagination
    const pag = document.getElementById('pagination');
    if (pages <= 1) { pag.innerHTML=''; return; }
    let html = `<span class="text-xs text-muted" style="margin-right:8px">${total} records</span>`;
    html += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for(let i=1;i<=pages;i++){
      if(i===1||i===pages||Math.abs(i-currentPage)<=1) html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      else if(Math.abs(i-currentPage)===2) html+=`<span style="color:var(--text-muted);padding:0 4px">…</span>`;
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
    pag.innerHTML = html;
  }

  function goPage(p) { currentPage=p; applyFilters(); }

  ['search-input','action-filter'].forEach(id => document.getElementById(id).addEventListener('input', applyFilters));
  document.getElementById('limit-select').addEventListener('change', loadLogs);

  loadLogs();
</script>
</body>
</html>
