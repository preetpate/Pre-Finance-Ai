<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users – Admin – Pre-Finance AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/admin.css" />
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon" style="background:linear-gradient(135deg,#EF4444,#F59E0B)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="sidebar-logo-text">Pre-Finance AI<span class="sidebar-logo-sub">Admin Panel</span></div>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">Admin</span>
      <a class="nav-item" href="dashboard.html"><span class="nav-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>Dashboard</a>
      <a class="nav-item active" href="users.html"><span class="nav-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Users</a>
      <a class="nav-item" href="documents.html"><span class="nav-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>Documents</a>
      <a class="nav-item" href="activity.html"><span class="nav-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>Activity Logs</a>
      <div class="divider" style="margin:8px 0"></div>
      <button class="nav-item logout-btn" style="border:none;width:100%;text-align:left;background:none"><span class="nav-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>Logout</button>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebar-avatar" style="background:linear-gradient(135deg,#EF4444,#F59E0B)">A</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
        <div class="sidebar-user-role" style="color:var(--warning)">Administrator</div>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn btn-ghost btn-icon menu-toggle" id="menu-toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div>
          <div class="topbar-title">User Management</div>
          <div class="topbar-breadcrumb">Admin / <span>Users</span></div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="badge badge-red">Admin Mode</span>
        <button class="topbar-icon-btn" id="theme-toggle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg></button>
      </div>
    </header>

    <main class="page-content">

      <div class="table-toolbar">
        <div class="table-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="user-search" placeholder="Search by name or email…" />
        </div>
        <select id="role-filter" class="form-input" style="width:auto;font-size:0.8125rem">
          <option value="">All roles</option>
          <option value="user">Users</option>
          <option value="admin">Admins</option>
        </select>
        <select id="status-filter" class="form-input" style="width:auto;font-size:0.8125rem">
          <option value="">All status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>User</th><th>Role</th><th>Status</th><th>Joined</th><th>Last Login</th><th>Actions</th>
          </tr></thead>
          <tbody id="users-tbody">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/ui.js"></script>
<script>
  requireAdmin();
  let allUsers = [];
  const me = Auth.getUser();

  async function loadUsers() {
    try {
      allUsers = await AdminAPI.users();
      renderUsers(allUsers);
    } catch (e) { Toast.error(e.message); }
  }

  function renderUsers(users) {
    const tbody = document.getElementById('users-tbody');
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">No users found</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>
          <div class="user-cell">
            <div class="user-avatar-sm">${initials(u.name)}</div>
            <div>
              <div class="user-name-cell">${escHtml(u.name)}</div>
              <div class="user-email-cell">${escHtml(u.email)}</div>
            </div>
          </div>
        </td>
        <td><span class="badge ${u.role === 'admin' ? 'badge-red' : 'badge-blue'}">${u.role}</span></td>
        <td><span class="badge ${u.is_active ? 'badge-green' : 'badge-gray'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
        <td class="text-sm text-muted">${formatDate(u.created_at)}</td>
        <td class="text-sm text-muted">${u.last_login ? formatDateTime(u.last_login) : 'Never'}</td>
        <td>
          ${u.id !== me?.id ? `
            <button class="btn btn-sm ${u.is_active ? 'btn-danger' : 'btn-secondary'}"
              onclick="toggleStatus('${u.id}', ${u.is_active}, '${escHtml(u.name)}')">
              ${u.is_active ? 'Deactivate' : 'Activate'}
            </button>
          ` : '<span class="text-xs text-muted">You</span>'}
        </td>
      </tr>
    `).join('');
  }

  async function toggleStatus(id, currentlyActive, name) {
    const action = currentlyActive ? 'deactivate' : 'activate';
    const ok = await confirm(`${currentlyActive ? 'Deactivate' : 'Activate'} User`, `Are you sure you want to ${action} ${name}?`);
    if (!ok) return;
    try {
      await AdminAPI.setUserStatus(id, !currentlyActive);
      Toast.success(`User ${action}d.`);
      loadUsers();
    } catch (e) { Toast.error(e.message); }
  }

  function applyFilters() {
    const q = document.getElementById('user-search').value.toLowerCase();
    const role = document.getElementById('role-filter').value;
    const status = document.getElementById('status-filter').value;
    renderUsers(allUsers.filter(u => {
      const matchQ = u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
      const matchR = !role || u.role === role;
      const matchS = !status || (status === 'active' ? u.is_active : !u.is_active);
      return matchQ && matchR && matchS;
    }));
  }

  ['user-search','role-filter','status-filter'].forEach(id =>
    document.getElementById(id).addEventListener('input', applyFilters)
  );

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  loadUsers();
</script>
</body>
</html>
